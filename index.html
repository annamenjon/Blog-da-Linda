<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogdaLinda</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Curiosidades</h1>
        <p>Meu primeiro Blog</p>
    </header>
    <main>
        <img src="Copa 2026.png" alt="Uma ilustração panorâmica e vibrante de um estádio de futebol lotado durante a Copa do Mundo de 2026 na América do Norte.
         A cena é dividida entre a ação no campo e a comemoração da torcida em primeiro plano.">

        <div>
            <h2>Meu primeiro post</h2>
            <p class="autor">Por: Anna Júlia Menjon</p>
            <p>Meu primeiro post sobre a Copa do Mundo</p>
            <button>🩷<span>0</span></button>
            <button>💔<span>0</span></button>
        </div>
    </main>
    <footer>
        <p>Por: Anna Júlia Menjon</p>
    </footer>
</body>
<script>
const botoes = document.querySelectorAll("button");

botoes.forEach(function(botao) 
    let curtiu = false;
    botao.addEventListener("click", botaoClicado);
    function botaoClicado (){
        let texto = botao.querySelector("span");
      if(curtiu===false){
        texto.textContent++;
        curtiu = true;
    }else{
        texto.textContent--;
        curtiu=false;
    }
}
)
</script>
</html>
